name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on tags like v1.0, v0.1.0-beta, ...
  workflow_dispatch: # Manual start from the GitHub website

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # Build on manual start, on version tags, or on pushes whose commit
    # message starts with "v" (e.g. "v1.23.45 - new feature").
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.event.head_commit.message, 'v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pyinstaller

      - name: Read Version and Changelog
        id: get_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "version.txt")) {
              throw "version.txt not found."
          }
          # version.txt contains e.g. "v1.23.45".
          # VERSION = without "v" (file names), TAG = with "v" (release tag).
          $raw = (Get-Content "version.txt" -Raw).Trim()
          if (-not $raw) {
              throw "version.txt is empty."
          }
          $version = $raw -replace '^[vV]', ''
          $tag = "v$version"

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "TAG=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # changelog.md is optional.
          if (Test-Path "changelog.md") {
              $changelog = Get-Content "changelog.md" -Raw
          }
          else {
              $changelog = ""
              Write-Host "::warning::changelog.md not found - release body without changelog."
          }
          "CHANGELOG<<CHANGELOG_END" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $changelog                 | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "CHANGELOG_END"            | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Version: $version  Tag: $tag"

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Same build as locally: options are maintained only in build_onefile.py.
          python build_onefile.py --clean
          if ($LASTEXITCODE -ne 0) {
              throw "Build failed. Exit code: $LASTEXITCODE"
          }
          $exePath = "dist\Anno_GUID_Tool_v${{ steps.get_version.outputs.VERSION }}.exe"
          if (-not (Test-Path $exePath)) {
              throw "Expected EXE was not created: $exePath"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # The EXE is the only release asset. config.ini and the GUID
          # databases are created by the tool itself on first start.
          files: |
            dist/Anno_GUID_Tool_v${{ steps.get_version.outputs.VERSION }}.exe
          name: Anno GUID Tool ${{ steps.get_version.outputs.TAG }}
          tag_name: ${{ steps.get_version.outputs.TAG }}
          draft: false
          # Builds from a version tag are full releases, all others pre-releases.
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          body: |
            Automatic build of Anno GUID Tool ${{ steps.get_version.outputs.TAG }}.

            ${{ steps.get_version.outputs.CHANGELOG }}

            ### Download
            You can find the executable file in the Assets section below.
            `config.ini` and the GUID databases (`guid_database_anno117.json`,
            `guid_database_anno1800.json`) are created automatically in the
            folder the EXE is started from.

            ### Support
            [Buy Me A Coffee](https://ko-fi.com/gz2k2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
